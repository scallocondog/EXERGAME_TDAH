<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#05030c;overflow:hidden}a{color:#4ff3ff}a:hover{color:#fff}</style>
</helmet>
<div ref="{{ rootRef }}" style="position:fixed;inset:0;background:#05030c;cursor:crosshair;font-family:'Chakra Petch',sans-serif;color:#fff;user-select:none">
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
  <div style="position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:24px;padding:28px 40px;pointer-events:none">
    <div style="display:flex;flex-direction:column;gap:2px;justify-self:start;padding:12px 22px;border:1px solid rgba(255,59,92,0.55);background:rgba(20,6,18,0.55);box-shadow:0 0 18px rgba(255,59,92,0.35), inset 0 0 12px rgba(255,59,92,0.15);clip-path:polygon(0 0,100% 0,100% 70%,88% 100%,0 100%)">
      <div style="font-size:13px;letter-spacing:0.35em;color:#ff8fa3">COMBO</div>
      <div style="font-size:48px;font-weight:700;line-height:1;text-shadow:0 0 14px rgba(255,59,92,0.9)">{{ combo }}</div>
    </div>
    <div style="position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center">
      <svg width="112" height="112" viewBox="0 0 112 112" style="position:absolute;inset:0;transform:rotate(-90deg);overflow:visible">
        <circle cx="56" cy="56" r="48" fill="rgba(8,6,24,0.6)" stroke="rgba(120,110,200,0.25)" stroke-width="6"></circle>
        <circle cx="56" cy="56" r="48" fill="none" stroke="#4ff3ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="{{ ringOffset }}" style="filter:drop-shadow(0 0 6px #4ff3ff);transition:stroke-dashoffset 0.2s"></circle>
      </svg>
      <div style="position:relative;display:flex;align-items:baseline;font-weight:700;text-shadow:0 0 12px rgba(79,243,255,0.9)">
        <span style="font-size:22px;color:#9ff8ff">x</span><span style="font-size:44px;line-height:1">{{ mult }}</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;align-items:flex-end;justify-self:end;padding:12px 22px;border:1px solid rgba(79,243,255,0.55);background:rgba(4,14,24,0.55);box-shadow:0 0 18px rgba(79,243,255,0.35), inset 0 0 12px rgba(79,243,255,0.15);clip-path:polygon(0 0,100% 0,100% 100%,12% 100%,0 70%)">
      <div style="font-size:13px;letter-spacing:0.35em;color:#9ff8ff">SCORE</div>
      <div style="font-size:48px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(79,243,255,0.9)">{{ score }}</div>
    </div>
  </div>
  <div style="position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;pointer-events:none">
    <div style="font-size:12px;letter-spacing:0.3em;color:rgba(200,190,255,0.75)">{{ hint }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:14,&quot;min&quot;:6,&quot;max&quot;:30,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { score: 48320, combo: 59, mult: 8, prog: 0 };
  rootRef = React.createRef();
  canvasRef = React.createRef();

  componentDidMount() {
    const cv = this.canvasRef.current, ctx = cv.getContext('2d');
    this.ctx = ctx; this.cubes = []; this.bits = []; this.halves = [];
    this.travel = 0; this.beatT = 0; this.time = 0;
    this.mouse = null; this.swing = { red: 0, blue: 0, redP: null, blueP: null };
    this.multProg = 0;
    const resize = () => {
      const r = this.rootRef.current.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
      cv.width = r.width * d; cv.height = r.height * d; this.W = r.width; this.H = r.height;
      ctx.setTransform(d, 0, 0, d, 0, 0);
    };
    resize();
    this.ro = new ResizeObserver(resize); this.ro.observe(this.rootRef.current);
    this.onMove = e => { const r = cv.getBoundingClientRect(); this.mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; };
    window.addEventListener('pointermove', this.onMove);
    let last = performance.now();
    const loop = t => {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      this.step(dt); this.draw();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf); this.ro && this.ro.disconnect();
    window.removeEventListener('pointermove', this.onMove);
  }

  proj(x, y, z) {
    const f = this.H * 0.9;
    return { x: this.W / 2 + x * f / z, y: this.H * 0.42 - y * f / z, s: f / z };
  }

  step(dt) {
    const speed = this.props.speed ?? 14;
    this.time += dt; this.travel += speed * dt;
    const beat = 60 / 128;
    this.beatT += dt;
    if (this.beatT > beat) {
      this.beatT -= beat;
      const pair = Math.random() < 0.25;
      const mk = color => {
        const lane = color === 'red' ? (Math.random() < 0.7 ? 0 : 1) : (Math.random() < 0.7 ? 3 : 2);
        const row = Math.random() < 0.65 ? 0 : 1;
        this.cubes.push({ x: -1.5 + lane, y: row ? 0 : -0.95, z: 42, color, dir: [0, 90, 180, 270][Math.floor(Math.random() * 4)], cut: false });
      };
      if (pair) { mk('red'); mk('blue'); } else mk(Math.random() < 0.5 ? 'red' : 'blue');
    }
    const auto = this.props.autoplay ?? true;
    const tips = this.saberGeom();
    for (const c of this.cubes) {
      c.z -= speed * dt;
      if (c.cut) continue;
      if (c.z < 4.2 && c.z > 1.4) {
        const p = this.proj(c.x, c.y, c.z), g = tips[c.color];
        const d = this.segDist(p, g.a, g.b);
        if (d < p.s * 0.55 || (auto && c.z < 2.6)) this.slice(c, p);
      } else if (c.z <= 1.4) {
        c.cut = true; c.miss = true; this.miss();
      }
    }
    this.cubes = this.cubes.filter(c => !c.cut && c.z > 0.5);
    for (const b of this.bits) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 600 * dt; b.life -= dt; }
    this.bits = this.bits.filter(b => b.life > 0);
    for (const h of this.halves) { h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 900 * dt; h.rot += h.vr * dt; h.life -= dt; }
    this.halves = this.halves.filter(h => h.life > 0);
    this.swing.red = Math.max(0, this.swing.red - dt * 4);
    this.swing.blue = Math.max(0, this.swing.blue - dt * 4);
  }

  segDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l; t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }

  slice(c, p) {
    c.cut = true;
    const col = c.color === 'red' ? '#ff2d55' : '#2de6ff';
    const w = p.s * 0.8, ang = (c.dir * Math.PI) / 180;
    const nx = Math.cos(ang), ny = Math.sin(ang);
    for (const sgn of [-1, 1]) this.halves.push({ x: p.x, y: p.y, w, col, sgn, ang, rot: 0, vr: sgn * 5, vx: nx * sgn * 260, vy: ny * sgn * 260 - 120, life: 0.6 });
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, v = 200 + Math.random() * 500;
      this.bits.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, life: 0.3 + Math.random() * 0.4, col });
    }
    this.swing[c.color] = 1; this.swing[c.color + 'P'] = { x: p.x, y: p.y };
    this.setState(s => {
      const need = s.mult === 1 ? 2 : s.mult === 2 ? 4 : 8;
      let mult = s.mult, prog = s.prog + 1;
      if (mult < 8 && prog >= need) { mult *= 2; prog = 0; }
      if (mult === 8) prog = Math.min(prog, 8);
      return { score: s.score + 115 * mult, combo: s.combo + 1, mult, prog };
    });
  }
  miss() {
    this.setState(s => ({ combo: 0, mult: Math.max(1, s.mult / 2), prog: 0 }));
  }

  saberGeom() {
    const W = this.W, H = this.H;
    const m = this.mouse || { x: W / 2, y: H * 0.55 + Math.sin(this.time * 1.3) * 30 };
    const out = {};
    for (const [k, bx, off] of [['red', W * 0.36, -W * 0.09], ['blue', W * 0.64, W * 0.09]]) {
      let tx = m.x + off, ty = m.y;
      const sw = this.swing[k], sp = this.swing[k + 'P'];
      if (sw > 0 && sp) { tx += (sp.x - tx) * sw; ty += (sp.y - ty) * sw; }
      const base = { x: bx, y: H + 30 };
      let ang = Math.atan2(ty - base.y, tx - base.x);
      ang = Math.max(-Math.PI + 0.25, Math.min(-0.25, ang));
      const L = H * 0.62, hl = 70;
      out[k] = { base, ang, a: { x: base.x + Math.cos(ang) * hl, y: base.y + Math.sin(ang) * hl }, b: { x: base.x + Math.cos(ang) * L, y: base.y + Math.sin(ang) * L } };
    }
    return out;
  }

  draw() {
    const ctx = this.ctx, W = this.W, H = this.H, hy = H * 0.42, t = this.time;
    const glow = this.props.glow ?? 1;
    ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
    let g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05030c'); g.addColorStop(0.42, '#1a0630'); g.addColorStop(0.43, '#07020f'); g.addColorStop(1, '#030108');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun
    const R = H * 0.2;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hy); ctx.clip();
    g = ctx.createLinearGradient(0, hy - R, 0, hy);
    g.addColorStop(0, '#ffb347'); g.addColorStop(0.5, '#ff3d7f'); g.addColorStop(1, '#8a1bd1');
    ctx.fillStyle = g; ctx.shadowColor = '#ff3d7f'; ctx.shadowBlur = 60 * glow;
    ctx.beginPath(); ctx.arc(W / 2, hy, R, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a0630';
    for (let i = 0; i < 7; i++) { const y = hy - R * 0.08 - i * R * 0.12; ctx.fillRect(W / 2 - R, y, R * 2, 2 + (7 - i) * 1.1); }
    ctx.restore();
    ctx.globalCompositeOperation = 'lighter';
    // lasers
    const lasers = [
      { x: W * 0.12, c: '255,45,85', s: 0.6, p: 0 }, { x: W * 0.88, c: '45,230,255', s: -0.6, p: 1 },
      { x: W * 0.3, c: '190,70,255', s: 0.9, p: 2 }, { x: W * 0.7, c: '190,70,255', s: -0.9, p: 3 }
    ];
    for (const L of lasers) {
      for (let k = 0; k < 2; k++) {
        const a = -Math.PI / 2 + Math.sin(t * L.s + L.p + k * 1.4) * 0.9;
        const pulse = 0.5 + 0.5 * Math.sin(t * 4 + L.p * 2 + k);
        ctx.strokeStyle = `rgba(${L.c},${0.25 + pulse * 0.45})`; ctx.lineWidth = 2;
        ctx.shadowColor = `rgb(${L.c})`; ctx.shadowBlur = 18 * glow;
        ctx.beginPath(); ctx.moveTo(L.x, hy); ctx.lineTo(L.x + Math.cos(a) * H * 2, hy + Math.sin(a) * H * 2); ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,61,127,0.8)'; ctx.fillRect(0, hy - 1, W, 2);
    // track plane
    ctx.globalCompositeOperation = 'source-over';
    const a0 = this.proj(-2.2, -1.6, 60), a1 = this.proj(2.2, -1.6, 60), a2 = this.proj(2.2, -1.6, 0.9), a3 = this.proj(-2.2, -1.6, 0.9);
    g = ctx.createLinearGradient(0, hy, 0, H);
    g.addColorStop(0, 'rgba(20,8,40,0.9)'); g.addColorStop(1, 'rgba(10,4,24,0.95)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(a0.x, a0.y); ctx.lineTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.lineTo(a3.x, a3.y); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    // grid
    ctx.lineWidth = 1;
    for (let x = -6; x <= 6; x++) {
      const p = this.proj(x, -1.6, 60), q = this.proj(x, -1.6, 0.9);
      ctx.strokeStyle = Math.abs(x) <= 2 ? 'rgba(140,90,255,0.35)' : 'rgba(255,61,160,0.22)';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    const sp = 2.5, off = this.travel % sp;
    for (let z = sp - off; z < 60; z += sp) {
      if (z < 0.9) continue;
      const p = this.proj(-6, -1.6, z), q = this.proj(6, -1.6, z), al = Math.max(0, 1 - z / 60);
      ctx.strokeStyle = `rgba(255,61,160,${0.5 * al})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    // rails
    for (const [x, c] of [[-2.2, '#ff2d55'], [2.2, '#2de6ff']]) {
      const p = this.proj(x, -1.6, 60), q = this.proj(x, -1.6, 0.9);
      ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.shadowColor = c; ctx.shadowBlur = 16 * glow;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    // arches
    const asp = 8, aoff = this.travel % asp;
    for (let z = asp - aoff; z < 60; z += asp) {
      if (z < 1.2) continue;
      const al = Math.min(1, (60 - z) / 25) * Math.min(1, (z - 1.2) / 2);
      const p = this.proj(-4, -1.6, z), q = this.proj(4, 3.2, z);
      ctx.strokeStyle = `rgba(190,70,255,${0.7 * al})`; ctx.lineWidth = Math.max(1, 30 / z);
      ctx.shadowColor = '#be46ff'; ctx.shadowBlur = 14 * glow;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, q.y); ctx.lineTo(q.x, q.y); ctx.lineTo(q.x, p.y); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // cubes
    ctx.globalCompositeOperation = 'source-over';
    const cubes = [...this.cubes].sort((a, b) => b.z - a.z);
    for (const c of cubes) this.drawCube(c, glow);
    // halves
    for (const h of this.halves) {
      ctx.save(); ctx.globalAlpha = Math.max(0, h.life / 0.6);
      ctx.translate(h.x, h.y); ctx.rotate(h.ang + h.rot);
      const w = h.w;
      ctx.fillStyle = h.col === '#ff2d55' ? '#3a0714' : '#062a36';
      ctx.strokeStyle = h.col; ctx.lineWidth = 2; ctx.shadowColor = h.col; ctx.shadowBlur = 14 * glow;
      ctx.beginPath(); ctx.rect(h.sgn < 0 ? -w / 2 : 0, -w / 2, w / 2, w); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const b of this.bits) {
      ctx.globalAlpha = Math.min(1, b.life * 2.5); ctx.strokeStyle = b.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.03, b.y - b.vy * 0.03); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // sabers
    const sab = this.saberGeom();
    for (const [k, c, rgb] of [['red', '#ff2d55', '255,45,85'], ['blue', '#2de6ff', '45,230,255']]) {
      const s = sab[k];
      ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
      ctx.strokeStyle = '#2a2838'; ctx.lineWidth = 16; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.base.x, s.base.y); ctx.lineTo(s.a.x, s.a.y); ctx.stroke();
      ctx.strokeStyle = '#8c8aa0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s.base.x, s.base.y); ctx.lineTo(s.a.x, s.a.y); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = c; ctx.shadowBlur = 40 * glow;
      ctx.strokeStyle = `rgba(${rgb},0.35)`; ctx.lineWidth = 26;
      ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke();
      ctx.shadowBlur = 20 * glow; ctx.strokeStyle = c; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'butt';
    // vignette
    g = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.3, W / 2, H * 0.5, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  drawCube(c, glow) {
    const ctx = this.ctx, s = 0.4;
    const col = c.color === 'red' ? '#ff2d55' : '#2de6ff';
    const fill = c.color === 'red' ? '#2a0610' : '#04202b';
    const side = c.color === 'red' ? '#1a040a' : '#02141c';
    const al = Math.max(0, Math.min(1, (42 - c.z) / 10));
    const P = (dx, dy, dz) => this.proj(c.x + dx, c.y + dy, c.z + dz);
    const f = [P(-s, s, -s), P(s, s, -s), P(s, -s, -s), P(-s, -s, -s)];
    const b = [P(-s, s, s), P(s, s, s), P(s, -s, s), P(-s, -s, s)];
    const poly = (pts, fl) => {
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath();
      ctx.fillStyle = fl; ctx.fill(); ctx.stroke();
    };
    ctx.save(); ctx.globalAlpha = al;
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, f[0].s * 0.035); ctx.lineJoin = 'round';
    ctx.shadowColor = col; ctx.shadowBlur = 16 * glow;
    if (c.y - s > 0) poly([f[3], f[2], b[2], b[3]], side);
    if (c.y + s < 0) poly([f[0], f[1], b[1], b[0]], side);
    if (c.x - s > 0) poly([f[0], f[3], b[3], b[0]], side);
    if (c.x + s < 0) poly([f[1], f[2], b[2], b[1]], side);
    ctx.shadowBlur = 24 * glow; poly(f, fill);
    const cx = (f[0].x + f[1].x) / 2, cy = (f[0].y + f[3].y) / 2, w = f[1].x - f[0].x;
    ctx.translate(cx, cy); ctx.rotate((c.dir * Math.PI) / 180);
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12 * glow;
    ctx.beginPath(); ctx.moveTo(-w * 0.32, -w * 0.12); ctx.lineTo(w * 0.32, -w * 0.12); ctx.lineTo(0, -w * 0.36); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(0, w * 0.12, w * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  renderVals() {
    const { score, combo, mult, prog } = this.state;
    const need = mult === 1 ? 2 : mult === 2 ? 4 : 8;
    const frac = mult === 8 ? 1 : prog / need;
    return {
      rootRef: this.rootRef, canvasRef: this.canvasRef,
      score: score.toLocaleString('en-US'), combo, mult,
      ringOffset: 301.6 * (1 - frac),
      hint: (this.props.autoplay ?? true) ? 'AUTOPLAY · MUEVE EL RATÓN PARA GUIAR LOS SABLES' : 'CORTA LOS BLOQUES CON EL SABLE DE SU COLOR'
    };
  }
}
</script>
</body>
</html>
